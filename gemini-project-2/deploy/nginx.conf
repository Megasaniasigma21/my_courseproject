server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 "";

    # Корень статики фронтенда (HTML, CSS, JS, IMAGES)
    root /Users/dmitriy/gemini-project-2/front-end;

    # Сжатие gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Главная страница: редирект на /HTML/index.html
    location = / {
        return 302 /HTML/index.html;
    }

    # 1. Бэкенд FastAPI (проксирование запросов к API)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Изображения фронтенда (маппинг /images/ на папку IMAGES/)
    location /images/ {
        alias /Users/dmitriy/gemini-project-2/front-end/IMAGES/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 3. Видеопоток (псевдо-стриминг MP4 с поддержкой перемотки)
    # Поддерживаем оба URL: /media/video/ и /movie/video/
    location ^~ /media/video/ {
        alias /Users/dmitriy/gemini-project-2/media/video/;

        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;

        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
    }

    location ^~ /movie/video/ {
        alias /Users/dmitriy/gemini-project-2/media/video/;

        mp4;
        mp4_buffer_size     1m;
        mp4_max_buffer_size 5m;

        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
    }

    # 4. Медиа-файлы (постеры 2:3, баннеры 16:9 и 1.2:1)
    location /media/ {
        alias /Users/dmitriy/gemini-project-2/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. Фронтенд (HTML, JS, STYLES, FONTS)
    location / {
        try_files $uri $uri/ =404;
    }
}
